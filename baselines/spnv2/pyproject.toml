[project]
name = "spnv2-oshd"
version = "0.1.0"
description = "SPNv2 (Park & D'Amico) trained on OSHD cube renders / real frames, as an OSHD baseline."
requires-python = ">=3.10,<3.12"
dependencies = [
    "oshd-bench",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy>=1.23,<2",
    "opencv-python-headless>=4.8,<4.11",
    "yacs==0.1.8",
    "albumentations==1.1.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "plyfile>=0.7.4",
    "torchinfo",
    "tqdm",
    "pillow",
    "matplotlib",
]

[project.scripts]
spnv2-convert = "spnv2_oshd.convert:main"
spnv2-train = "spnv2_oshd.train:main"
spnv2-predict = "spnv2_oshd.predict:main"
spnv2-list = "spnv2_oshd.lists:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spnv2_oshd"]

[tool.uv.sources]
oshd-bench = { path = "../../bench", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
