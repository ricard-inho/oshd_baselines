[project]
name = "oshd-policy-replay"
version = "0.1.0"
description = "Table II: frozen PPO policy replayed on estimator-substituted observations (OSHD)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "oshd-bench",
    "onnxruntime>=1.17",
    "numpy>=1.23",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
policy-replay = "policy_replay.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_replay"]

[tool.uv.sources]
oshd-bench = { path = "../../bench", editable = true }
