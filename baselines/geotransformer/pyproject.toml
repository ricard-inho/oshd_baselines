[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oshd-geotr"
version = "0.1.0"
description = "GeoTransformer (ModelNet weights, fine-tuned on cube crops) for OSHD Table I, LiDAR row."
requires-python = ">=3.10,<3.13"
dependencies = [
    "oshd-bench",
    "oshd-lidar",            # the shared training-free target crop (baselines/lidar_registration)
    "torch==2.4.1",
    "numpy<2",
    "scipy",
    "easydict",
    "einops",
    "coloredlogs",
    "tensorboard",
    "ipdb",
    "ipython",
    "nibabel",
    "scikit-learn",
    "open3d>=0.18",
    "tqdm",
    "ninja",
    "matplotlib",
]

[project.scripts]
geotr-train = "oshd_geotr.trainval:main"
geotr-predict = "oshd_geotr.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oshd_geotr"]

[tool.uv.sources]
oshd-bench = { path = "../../bench", editable = true }
oshd-lidar = { path = "../lidar_registration", editable = true }
