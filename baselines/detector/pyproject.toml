[project]
name = "pooh-detector"
version = "0.1.0"
description = "Mask R-CNN (torchvision R50-FPN v2) target detector for the POOH-D model-based pose baselines."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pooh-bench",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy>=1.23,<2.3",
    "pandas>=2.0",
    "pillow>=10",
    "tqdm>=4.60",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

[tool.uv.sources]
pooh-bench = { path = "../../bench", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
