[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oshd-lidar"
version = "0.1.0"
description = "LiDAR target crop + FPFH/TEASER++/ICP registration baseline for OSHD (Table I, LiDAR row)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "oshd-bench",
    "open3d>=0.18",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.scripts]
lidar-stats = "oshd_lidar.stats:main"
lidar-extrinsic = "oshd_lidar.extrinsic:main"
lidar-reg-predict = "oshd_lidar.predict:main"
lidar-viz = "oshd_lidar.viz:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oshd_lidar"]

[tool.uv.sources]
oshd-bench = { path = "../../bench", editable = true }
