[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pooh-lidar"
version = "0.1.0"
description = "LiDAR target crop + FPFH/TEASER++/ICP registration baseline for POOH-D (Table I, LiDAR row)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pooh-bench",
    "open3d>=0.18",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.scripts]
lidar-stats = "pooh_lidar.stats:main"
lidar-extrinsic = "pooh_lidar.extrinsic:main"
lidar-reg-predict = "pooh_lidar.predict:main"
lidar-viz = "pooh_lidar.viz:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pooh_lidar"]

[tool.uv.sources]
pooh-bench = { path = "../../bench", editable = true }
