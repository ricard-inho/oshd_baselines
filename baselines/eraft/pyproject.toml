[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pooh-eraft"
version = "0.1.0"
description = "E-RAFT (Gehrig et al. 2021) event optical flow on the POOH-D target (Table III)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pooh-bench",
    "torch>=2.5.1,<2.6",
    "torchvision>=0.20.1,<0.21",
    "numpy<2",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.scripts]
eraft-train = "eraft_pooh.train:main"
eraft-predict = "eraft_pooh.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eraft_pooh"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
pooh-bench = { path = "../../bench", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
