[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pooh-event-keypoints"
version = "0.1.0"
description = "Voxel-grid keypoint network (ours) for event-based pose of the POOH-D CubeSat."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pooh-bench",
    "torch>=2.5.1,<2.6",
    "torchvision>=0.20.1,<0.21",
    "numpy<2",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.scripts]
ekp-train = "event_keypoints.train:main"
ekp-predict = "event_keypoints.predict:main"
ekp-debug = "event_keypoints.debug:main"

[tool.hatch.build.targets.wheel]
packages = ["src/event_keypoints"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
pooh-bench = { path = "../../bench", editable = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
