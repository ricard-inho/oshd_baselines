[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oshd-bench"
version = "0.1.0"
description = "Shared ground truth, prediction formats and metrics for the OSHD baselines."
requires-python = ">=3.10"
dependencies = [
    "oshd[mesh]>=1.1.0",   # benchmark_v1 .. v3, domain "twin", sim lidar about the sensor
    "numpy>=1.23",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "tqdm>=4.60",
]

[project.scripts]
oshd-bench = "oshd_bench.cli:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
