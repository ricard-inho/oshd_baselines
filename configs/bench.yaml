# POOH-D benchmark configuration: which predictions fill which table cell, metric settings
# and the condition-analysis bins. Paths are relative to the repo root.

dataset:
  root: null            # null = pooh-dataset's default cache (~/.cache/pooh_dataset/<repo>)
  repo_id: r3m3c3/off_test
  # Frozen split for the paper: pooh-dataset's benchmark_v1 (Hub revision 8205a11, its train /
  # test lists). Download its data with `pooh download --benchmark v1 ...`. $POOH_BENCHMARK
  # overrides it ("none": the dataset's own splits.json, e.g. the dev dataset).
  benchmark: v1
results_dir: results

objects: [cubesat]
symmetries:
  cubesat: {type: cube, center: auto}   # 24 rotations about the cube-body centre

metrics:
  speed_t_threshold: 2.173e-3           # SPEED+ precision thresholds; set both to 0 to disable
  speed_q_threshold_deg: 0.169
  add_auc_max_m: 0.10                   # PoseCNN / YCB-Video convention (10 cm)
  add_model_points: 1000

sampling:                               # used by `pooh-bench gt`
  stride: {firefly: 1, realsense_color: 1, lidar: 1, events: 1}
  events_rate_hz: 20
  events_window_ms: 50
  lidar_max_range_m: 15

# Table I rows. `modality` is the results/predictions/<modality> folder, `sensor` the frame
# the poses are expressed in, `group` the column it feeds in Fig. 1.
table1:
  - {label: "RGB (Firefly)",     modality: rgb_firefly,    sensor: firefly,         group: rgb,
     methods: [{key: megapose, label: MegaPose, settings: [ZS, FT]},
               {key: spnv2,    label: SPNv2,    settings: [ZS, FT]}]}
  - {label: "RGB (RealSense)",   modality: rgb_realsense,  sensor: realsense_color, group: rgb,
     methods: [{key: megapose, label: MegaPose, settings: [ZS, FT]},
               {key: spnv2,    label: SPNv2,    settings: [ZS, FT]}]}
  - {label: "RGB-D (RealSense)", modality: rgbd_realsense, sensor: realsense_color, group: rgbd,
     methods: [{key: foundationpose,     label: "FoundationPose (RGB-D)", settings: [ZS, FT]},
               {key: foundationpose_icp, label: "FoundationPose + ICP",   settings: [ZS, FT]}]}
  - {label: "LiDAR",             modality: lidar,          sensor: lidar,           group: lidar,
     methods: [{key: fpfh_teaser_icp, label: "FPFH + TEASER++ + ICP", settings: [ZS]},
               {key: geotransformer,  label: GeoTransformer,          settings: [ZS, FT]}]}
  - {label: "Events",            modality: events,         sensor: events,          group: events,
     methods: [{key: e2vid_megapose,  label: "E2VID + MegaPose",        settings: [ZS, FT]},
               {key: event_keypoints, label: "Voxel-grid keypoint net", settings: [ZS, FT]}]}

# Fig. 1: best (lowest S_real) method+setting per group, or pin one: {rgb: rgb_firefly/spnv2/FT}
fig1:
  groups: [rgb, rgbd, lidar, events]
  pin: {}
  range_bins_m: [0.25, 0.35, 0.45, 0.6, 0.8, 1.0, 1.5, 2.0, 3.0]   # real test so far: 0.28-1.14 m
  ang_rate_bins_dps: [0.3, 1, 3, 10, 30, 100, 300]   # log-spaced for the log x-axis; real test so far: 0.3-145 deg/s
  min_samples_per_bin: 5                        # fewer -> NaN (pgfplots skips it)
  glare_label: glare                            # trajectory_info.illumination value

# Table II: results/replay/<key>.parquet (column delta_a = ||a_replay - a_logged||_2)
table2:
  rows:
    - {key: mocap,  label: Mocap}
    - {key: rgb,    label: RGB}
    - {key: rgbd,   label: RGB-D}
    - {key: lidar,  label: LiDAR}
    - {key: events, label: Events}

# Table III: results/flow/<method>/<setting>/real_test.parquet
table3:
  - {key: eraft, label: E-RAFT, settings: [ZS, FT]}
